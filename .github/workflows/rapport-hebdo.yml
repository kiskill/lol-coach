name: Rapport hebdomadaire

on:
  # Chaque mercredi à 5h UTC (7h à Paris en été, 6h en hiver),
  # le lendemain de la soirée de jeu du mardi. Ajuste si besoin.
  schedule:
    - cron: "0 5 * * 3"
  # Bouton "Run workflow" pour lancer à la main
  workflow_dispatch:

permissions:
  contents: write   # pour sauvegarder les nouvelles parties dans data/
  pages: write      # pour publier le site
  id-token: write

concurrency:
  group: rapport
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer les parties et générer le site
        run: python main.py update
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Sauvegarder les données dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Données du $(date +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
